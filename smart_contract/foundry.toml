[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
solc    = "0.8.20"

# Celo Mainnet RPC — set CELO_RPC_URL in your environment
# e.g. export CELO_RPC_URL=https://forno.celo.org
[rpc_endpoints]
celo        = "${CELO_RPC_URL}"
celo_alfajores = "https://alfajores-forno.celo-testnet.org"

[etherscan]
celo = { key = "${CELOSCAN_API_KEY}", url = "https://api.celoscan.io/api" }

# cUSD on Celo Mainnet: 0x765DE816845861e75A25fCA122bb6898B8B1282a
# cUSD on Alfajores:    0x874069Fa1Eb16D44d622F2e0Ca25eeA172369bC1
